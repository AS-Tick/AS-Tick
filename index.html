<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS-Tick Script Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 5px; color: #38bdf8; }
        .sub-title { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        .search-box {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        .search-box:focus { border-color: #38bdf8; }

        .script-list {
            text-align: left;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .script-item {
            background-color: #334155;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .script-item:hover { background-color: #475569; }

        .ad-container {
            background-color: #0f172a;
            border: 1px dashed #38bdf8;
            padding: 10px;
            margin: 15px 0;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn:hover { background-color: #7dd3fc; }

        textarea {
            width: 100%;
            height: 80px;
            background-color: #0f172a;
            color: #4ade80;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            resize: none;
            margin-bottom: 10px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="home-view">
    <h1>AS-Tick</h1>
    <p class="sub-title">Search & Get Roblox Scripts</p>

    <input type="text" id="searchInput" class="search-box" placeholder="Search scripts..." onkeyup="filterScripts()">

    <div class="script-list" id="scriptList">
        <div class="script-item" onclick="openScript('AS-Tick Script', 'loadstring(game:HttpGet(\'https://gist.githubusercontent.com/AS-Tick/c31b0afef647e61447c7e56fbaf24285/raw/Slapper.lua\'))()')">
            <span>AS-Tick Script</span>
            <span style="color: #38bdf8; font-size: 13px;">Get Script &rarr;</span>
        </div>
    </div>
</div>

<div class="container hidden" id="unlock-view">
    <h1 id="selectedScriptName">Script Title</h1>
    <p class="sub-title">Wait for the timer to unlock your loadstring</p>

    <!-- ADSTERRA AD PLACEMENT -->
    <div class="ad-container">
        <script async="async" data-cfasync="false" src="https://pl31052520.profitableratecpmnetwork.com/4ac8f0b1a9c0721fd8b405568e58e1b8/invoke.js"></script>
        <div id="container-4ac8f0b1a9c0721fd8b405568e58e1b8"></div>
    </div>

    <div id="timer-text" class="timer">Please wait: <span id="count">30</span> seconds</div>

    <div id="script-area" class="hidden">
        <textarea id="scriptText" readonly></textarea>
        <button class="btn" onclick="copyScript()">Copy Script</button>
        <br><br>
        <button class="btn" style="background-color: #475569; color: #fff;" onclick="goBack()">&larr; Back to Search</button>
    </div>
</div>

<script>
    let currentScript = "";
    let countdown;

    function filterScripts() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let items = document.getElementsByClassName('script-item');
        for (let i = 0; i < items.length; i++) {
            let text = items[i].textContent || items[i].innerText;
            items[i].style.display = text.toLowerCase().indexOf(input) > -1 ? "" : "none";
        }
    }

    function openScript(name, script) {
        document.getElementById('home-view').classList.add('hidden');
        document.getElementById('unlock-view').classList.remove('hidden');
        document.getElementById('selectedScriptName').textContent = name;
        currentScript = script;
        
        let timeLeft = 30;
        document.getElementById('count').textContent = timeLeft;
        document.getElementById('timer-text').style.display = 'block';
        document.getElementById('script-area').classList.add('hidden');

        clearInterval(countdown);
        countdown = setInterval(() => {
            timeLeft--;
            document.getElementById('count').textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                document.getElementById('timer-text').style.display = 'none';
                document.getElementById('script-area').classList.remove('hidden');
                document.getElementById('scriptText').value = currentScript;
            }
        }, 1000);
    }

    function goBack() {
        document.getElementById('unlock-view').classList.add('hidden');
        document.getElementById('home-view').classList.remove('hidden');
    }

    function copyScript() {
        const copyText = document.getElementById("scriptText");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("Script Copied Successfully!");
    }
</script>

</body>
</html>
