
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AS-Tick Script Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }

        .banner {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            padding: 18px;
            margin: 20px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .search {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 16px;
        }

        .script-item {
            background: #334155;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .script-item:hover {
            background: #475569;
        }

        .hidden {
            display: none;
        }

        .timer {
            color: #fbbf24;
            font-size: 20px;
            font-weight: bold;
            margin: 25px 0;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .green {
            background: #22c55e;
            color: white;
        }

        .back {
            background: #475569;
            color: white;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

<!-- HOME PAGE -->

<div class="container" id="home">

    <h1>AS-Tick</h1>

    <p class="subtitle">Script Hub</p>

    <div class="banner">
        WAIT 10 SECONDS AND GET LINK
    </div>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search scripts..."
        oninput="searchScripts()"
    >

    <div id="scriptList">

        <div class="script-item"
             onclick="openScript()">

            <span>AS-Tick Script</span>

            <span style="color:#38bdf8">
                Get Link →
            </span>

        </div>

    </div>

    <p id="noResults" class="hidden">
        No scripts found.
    </p>

    <div class="footer">
        AS-Tick Script Hub
    </div>

</div>


<!-- LINK PAGE -->

<div class="container hidden" id="linkPage">

    <h1>AS-Tick Script</h1>

    <p class="subtitle">
        Complete the timer to unlock your link.
    </p>

    <div class="banner">
        WAIT 10 SECONDS AND GET LINK
    </div>

    <div class="timer" id="timer">
        Please wait 10 seconds...
    </div>

    <a
        id="getLink"
        class="btn green hidden"
        href="https://terasharefile.com/s/1JsP9wlmT0X9_FyBuG8DLrQ"
        target="_blank"
        rel="noopener noreferrer">

        GET LINK

    </a>

    <button
        class="btn back"
        onclick="goBack()">

        ← Back to Search

    </button>

    <div class="footer">
        AS-Tick Script Hub
    </div>

</div>


<script>

    let countdown;

    function searchScripts() {

        const input =
            document.getElementById("search")
            .value.toLowerCase();

        const item =
            document.querySelector(".script-item");

        const found =
            "as-tick script".includes(input);

        item.style.display = found ? "flex" : "none";

        document.getElementById("noResults")
            .classList.toggle("hidden", found);

    }


    function openScript() {

        document.getElementById("home")
            .classList.add("hidden");

        document.getElementById("linkPage")
            .classList.remove("hidden");

        const timer =
            document.getElementById("timer");

        const link =
            document.getElementById("getLink");

        link.classList.add("hidden");

        let seconds = 10;

        timer.textContent =
            "Please wait " + seconds + " seconds...";

        clearInterval(countdown);

        countdown = setInterval(function() {

            seconds--;

            if (seconds > 0) {

                timer.textContent =
                    "Please wait " + seconds + " seconds...";

            } else {

                clearInterval(countdown);

                timer.textContent =
                    "Your link is ready!";

                link.classList.remove("hidden");

            }

        }, 1000);

    }


    function goBack() {

        clearInterval(countdown);

        document.getElementById("linkPage")
            .classList.add("hidden");

        document.getElementById("home")
            .classList.remove("hidden");

    }

</script>

</body>
</html>
