
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AS-Tick Script Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
    width: 100%;
    max-width: 450px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

h1 {
    color: #38bdf8;
}

.banner {
    background: linear-gradient(135deg, #0284c7, #2563eb);
    padding: 18px;
    border-radius: 10px;
    margin: 20px 0;
    font-weight: bold;
}

.btn {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    background: #22c55e;
    color: white;
}

.timer {
    color: #fbbf24;
    font-size: 20px;
    margin: 20px 0;
    font-weight: bold;
}

.hidden {
    display: none;
}

.footer {
    color: #64748b;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>AS-Tick</h1>
<p>Script Hub</p>

<div class="banner">
WAIT 10 SECONDS AND GET LINK
</div>

<button class="btn" id="startBtn" onclick="startTimer()">
GET LINK
</button>

<div id="timer" class="timer hidden"></div>

<a
id="finalLink"
class="btn hidden"
href="https://terasharefile.com/s/1JsP9wlmT0X9_FyBuG8DLrQ"
target="_blank"
rel="noopener noreferrer">

DOWNLOAD LINK

</a>

<div class="footer">
AS-Tick Script Hub
</div>

</div>

<script>

let countdown;

function startTimer() {

    const startBtn = document.getElementById("startBtn");
    const timer = document.getElementById("timer");
    const finalLink = document.getElementById("finalLink");

    startBtn.classList.add("hidden");
    timer.classList.remove("hidden");
    finalLink.classList.add("hidden");

    let seconds = 10;

    timer.textContent = "Please wait " + seconds + " seconds...";

    clearInterval(countdown);

    countdown = setInterval(function() {

        seconds--;

        if (seconds > 0) {

            timer.textContent =
            "Please wait " + seconds + " seconds...";

        } else {

            clearInterval(countdown);

            timer.textContent = "Your link is ready!";

            finalLink.classList.remove("hidden");

        }

    }, 1000);

}

</script>

</body>
</html>
